spring.application.name: notificationService
server.port: 8410
spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
      auto-offset-reset: earliest

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    # Local dev: avoid registering with a corporate host name that other
    # processes can't resolve (e.g., LTINxxxx.cts.com). Using IP keeps
    # gateway -> service routing stable.
    prefer-ip-address: true
    # Don't force hostname; let Eureka publish the IP when prefer-ip-address=true

kafka:
  topic:
    bookings: booking-events
